name: Build Wilayah Data

on:
  workflow_dispatch: # Memungkinkan eksekusi manual dari tab Actions
  push:
    paths:
      - 'scripts/build-wilayah.mjs'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ensure target directory exists
        run: mkdir -p js

      - name: Run build script
        run: node scripts/build-wilayah.mjs

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add js/wilayah.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update js/wilayah.json" && git push)
